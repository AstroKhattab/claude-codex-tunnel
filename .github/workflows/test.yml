name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: git identity for the throwaway test repo
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: offline end-to-end tests (fake codex and claude)
        run: /bin/bash tests/run.sh
